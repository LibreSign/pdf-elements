name: Feature request
description: Propose an improvement or new use case for PDF Elements
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user or developer problem before describing the solution.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Show where this would be useful in a real PDF or document workflow.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe an API, UI or behavior if you already have an approach in mind.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include workarounds or alternative approaches you have tried.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be interested in working on this change.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for similar requests.
          required: true
